llm:
  provider: anthropic           # "anthropic" (API) or "ollama" (local LLM, e.g. `ollama run qwen2.5:14b`)
  # ollama provider only (ignored otherwise):
  ollama_base_url: "http://localhost:11434"   # or OLLAMA_HOST for a remote instance
  ollama_model: "qwen2.5:14b"                 # or set OLLAMA_MODEL env var
  ollama_timeout: 600                         # seconds, before giving up waiting for a slow local model

anthropic:
  api_key: "sk-ant-..."                       # only needed when provider: anthropic

candidate:
  name: "Jane Doe"
  email: "jane@example.com"
  phone: "+1 555 000 0000"
  linkedin: "linkedin.com/in/janedoe/"

pipeline:
  threshold: 60                # minimum score (0-100) to generate outputs
  model: "claude-sonnet-4-6"   # model used when llm.provider: anthropic
  top_stories: 3               # number of top STAR stories passed to each prompt
  resume_word_count_min: 500   # resume_matcher flags the resume as under/over target outside this range
  resume_word_count_max: 700

prefilter:
  min_keyword_matches: 3 # experience-bank keyword overlaps required before batch.py spends tokens on a posting

batch:
  max_workers: 3         # parallel pipeline runs in batch.py
